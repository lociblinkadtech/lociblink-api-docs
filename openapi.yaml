          --header 'X-Api-Key: YOUR_API_KEY' \
          --header 'Content-Type: application/json' \
          --header 'Accept: application/json' \
          --data '{
            "to": "919876543210",
            "templateName": "festive_sale_offer",
            "languageCode": "en_US",
            "headerMediaUrl": "https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da",
            "headerMediaType": "IMAGE",
            "bodyParameters": [
              "Sneha",
              "25",
              "FESTIVE25"
            ],
            "buttons": [
              {
                "type": "url",
                "index": 0,
                "value": "FESTIVE25"
              }
            ]
        }'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - templateName
              properties:
                to:
                  type: string
                  description: Recipient WhatsApp number in international format
                  example: "919876543210"
                templateName:
                  type: string
                  description: WhatsApp template name
                  example: festive_sale_offer
                languageCode:
                  type: string
                  description: Template language code
                  example: en_US
                headerMediaUrl:
                  type: string
                  description: URL for campaign banner image
                  example: "https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da"
                headerMediaType:
                  type: string
                  description: Type of media for header
                  example: IMAGE
                bodyParameters:
                  type: array
