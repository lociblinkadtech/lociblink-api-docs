openapi: 3.0.3

info:
  title: LociBlink WhatsApp API
  description: LociBlink API for WhatsApp messaging and customer engagement
  version: 1.0.0

servers:
  - url: https://api.lociblink.com/api
    description: Production
  - url: http://localhost:8080/integrations/api/v1/whatsapp
    description: Local Development

security:
  - apiKeyAuth: []
  - bearerAuth: []

tags:
  - name: WhatsApp
    x-displayName: WhatsApp
  - name: Business
    x-parent: WhatsApp
  - name: Templates
    x-parent: WhatsApp
  - name: Messages
    x-parent: WhatsApp

paths:
  /business:
    get:
      tags:
        - Business
      summary: Get business details
      operationId: getBusiness
      responses:
        "200":
          description: Business details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        businessName:
                          type: string
                          example: "Lociblink Private Limited"
                        displayPhoneNumber:
                          type: string
                          example: "+91 9876543210"
                        profilePictureUrl:
                          type: string
                          example: "/integrations/api/whatsapp/profile-picture/sample_profile_pic"
                        status:
                          type: string
                          example: "ACTIVE"
                        errorMessage:
                          type: string
                          nullable: true
                          example: null
                        createdAt:
                          type: string
                          example: "2026-07-26T00:04:38"
                        updatedAt:
                          type: string
                          example: "2026-09-18T14:36:32.137705"
              example:
                success: true
                message: "Success"
                data:
                  - businessName: "Lociblink Private Limited"
                    displayPhoneNumber: "+91 9876543210"
                    profilePictureUrl: "/integrations/api/whatsapp/profile-picture/sample_profile_pic"
                    status: "ACTIVE"
                    errorMessage: null
                    createdAt: "2026-07-26T00:04:38"
                    updatedAt: "2026-09-18T14:36:32.137705"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid or missing API key
                  code:
                    type: integer
                    example: 401
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: An unexpected error occurred while processing the request
                  code:
                    type: integer
                    example: 500

  /templates:
    get:
      tags:
        - Templates
      summary: Get all WhatsApp Templates
      operationId: getAllTemplates
      responses:
        "200":
          description: Templates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        templateId:
                          type: string
                          example: "1000000000000001"
                        templateName:
                          type: string
                          example: welcome_user
                        category:
                          type: string
                          enum:
                            - UTILITY
                            - MARKETING
                            - AUTHENTICATION
                          example: UTILITY
                        languageCode:
                          type: string
                          example: en_US
                        phoneNumber:
                          type: string
                          example: "+91 9876543210"
                        status:
                          type: integer
                          description: Status code of the template (e.g. 2 for APPROVED)
                          example: 2
                        deleted:
                          type: boolean
                          example: false
                        mediaUrl:
                          type: string
                          nullable: true
                          example: null
                        message:
                          type: string
                          description: JSON stringified message structure containing components, body text, and parameters
                          example: '{"type":"BODY","text":"Welcome to {{1}}. Your account setup is complete. Thank you for choosing us.","example":{"body_text":[["John"]]}}'
                        createdAt:
                          type: string
                          example: "2026-08-12 10:00:00.000000"
                        updateDate:
                          type: string
                          example: "2026-08-12 10:00:00.000000"
              example:
                success: true
                message: "Success"
                data:
                  - category: "UTILITY"
                    createdAt: "2026-08-12 10:00:00.000000"
                    deleted: false
                    languageCode: "en_US"
                    mediaUrl: null
                    message: '{"type":"BODY","text":"Welcome to {{1}}. Your account setup is complete. Thank you for choosing us.","example":{"body_text":[["John"]]}}'
                    phoneNumber: "+91 9876543210"
                    status: 2
                    templateId: "1000000000000001"
                    templateName: "welcome_user"
                    updateDate: "2026-08-12 10:00:00.000000"
                  - category: "MARKETING"
                    createdAt: "2026-09-10 10:00:00"
                    deleted: false
                    languageCode: "en_US"
                    mediaUrl: null
                    message: '{"type":"body","text":"Special festive offer for {{1}}! Get 25% off on your next purchase with code {{2}}.","example":{"body_text":[["John","FESTIVE25"]]}},{"type":"buttons","buttons":[{"type":"url","text":"View Offers","url":"https://www.example.com/offers"}]}'
                    phoneNumber: "+91 9876543210"
                    status: 2
                    templateId: "1000000000000002"
                    templateName: "festive_sale_offer"
                    updateDate: "2026-09-10 10:00:00"
                  - category: "AUTHENTICATION"
                    createdAt: "2026-09-11 10:00:00"
                    deleted: false
                    languageCode: "en_US"
                    mediaUrl: null
                    message: '{"type":"body","add_security_recommendation":true},{"type":"buttons","buttons":[{"type":"otp","text":"Copy Code","otp_type":"COPY_CODE"}]}'
                    phoneNumber: "+91 9876543210"
                    status: 2
                    templateId: "1000000000000003"
                    templateName: "otp_verification"
                    updateDate: "2026-09-11 10:00:00"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid or missing API key
                  code:
                    type: integer
                    example: 401
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: An unexpected error occurred while processing the request
                  code:
                    type: integer
                    example: 500

    post:
      tags:
        - Templates
      summary: Create WhatsApp Template
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - language
                - category
              properties:
                name:
                  type: string
                  description: WhatsApp template name
                  example: hello_customer
                language:
                  type: string
                  description: Template language code
                  example: en_US
                category:
                  type: string
                  description: Template category
                  enum:
                    - UTILITY
                    - MARKETING
                    - AUTHENTICATION
                  example: UTILITY
                components:
                  type: array
                  description: Template structure components (headers, body text, buttons)
                  items:
                    type: object
      responses:
        "201":
          description: Template created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: template_123
                  name:
                    type: string
                    example: hello_customer
                  category:
                    type: string
                    example: UTILITY
                  language:
                    type: string
                    example: en_US
                  status:
                    type: string
                    example: APPROVED
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Invalid request payload or missing required parameters
                  code:
                    type: integer
                    example: 400
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid or missing API key
                  code:
                    type: integer
                    example: 401
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: An unexpected error occurred while processing the request
                  code:
                    type: integer
                    example: 500

  /templates/{id}:
    get:
      tags:
        - Templates
      summary: Get WhatsApp Template
      operationId: getTemplate
      parameters:
        - name: id
          in: path
          required: true
          description: Template identifier or name
          schema:
            type: string
            example: template_123
      responses:
        "200":
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: template_123
                  name:
                    type: string
                    example: hello_customer
                  category:
                    type: string
                    example: UTILITY
                  language:
                    type: string
                    example: en_US
                  status:
                    type: string
                    example: APPROVED
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid or missing API key
                  code:
                    type: integer
                    example: 401
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not Found
                  message:
                    type: string
                    example: Template with specified ID was not found
                  code:
                    type: integer
                    example: 404
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: An unexpected error occurred while processing the request
                  code:
                    type: integer
                    example: 500

  /messages/transactional:
    post:
      tags:
        - Messages
      summary: Send Transactional Message
      operationId: sendTransactionalMessage
      description: |
        Send utility updates, order confirmations, booking receipts, or delivery notifications using approved transactional templates.

        ```bash
        curl --location 'http://localhost:8080/integrations/api/v1/whatsapp/messages' \
          --header 'X-Api-Key: YOUR_API_KEY' \
          --header 'Content-Type: application/json' \
          --header 'Accept: application/json' \
          --data '{
            "to": "919876543210",
            "templateName": "order_confirmation",
            "languageCode": "en_US",
            "bodyParameters": [
              "Sneha",
              "ORD-78901",
              "₹1,499",
              "Tomorrow, 5 PM"
            ],
            "buttons": [
              {
                "type": "url",
                "index": 0,
                "value": "ORD-78901"
              }
            ]
        }'
        ```
        *(Optional: For invoices with a PDF document header, simply add `"headerMediaUrl": "https://example.com/invoice.pdf"` and `"headerMediaType": "DOCUMENT"`).*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - templateName
              properties:
                to:
                  type: string
                  description: Recipient WhatsApp number in international format
                  example: "919876543210"
                templateName:
                  type: string
                  description: WhatsApp template name
                  example: order_confirmation
                languageCode:
                  type: string
                  description: Template language code
                  example: en_US
                headerMediaUrl:
                  type: string
                  description: Optional URL for invoice PDF or media header
                  example: "https://example.com/invoice.pdf"
                headerMediaType:
                  type: string
                  description: Media type of header (e.g. DOCUMENT)
                  example: DOCUMENT
                bodyParameters:
                  type: array
                  description: Parameters for template body placeholders
                  items:
                    type: string
                  example:
                    - "Sneha"
                    - "ORD-78901"
                    - "₹1,499"
                    - "Tomorrow, 5 PM"
                buttons:
                  type: array
                  description: Dynamic buttons configuration
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: url
                      index:
                        type: integer
                        example: 0
                      value:
                        type: string
                        example: ORD-78901
            example:
              to: "919876543210"
              templateName: "order_confirmation"
              languageCode: "en_US"
              bodyParameters:
                - "Sneha"
                - "ORD-78901"
                - "₹1,499"
                - "Tomorrow, 5 PM"
              buttons:
                - type: "url"
                  index: 0
                  value: "ORD-78901"
      responses:
        "200":
          description: Message accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Message sent successfully
                  data:
                    type: object
                    properties:
                      messaging_product:
                        type: string
                        example: whatsapp
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            input:
                              type: string
                              example: "919876543210"
                            wa_id:
                              type: string
                              example: "919876543210"
                      messages:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "wamid.HBgMOTE5ODc2NTQzMjEwFQIAERgSQ0E1MzdGQ0FFRkU4MDgzODNEAA=="
                            message_status:
                              type: string
                              example: accepted
              example:
                success: true
                message: "Message sent successfully"
                data:
                  messaging_product: "whatsapp"
                  contacts:
                    - input: "919876543210"
                      wa_id: "919876543210"
                  messages:
                    - id: "wamid.HBgMOTE5ODc2NTQzMjEwFQIAERgSQ0E1MzdGQ0FFRkU4MDgzODNEAA=="
                      message_status: "accepted"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Invalid request payload or missing required parameters
                  code:
                    type: integer
                    example: 400
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid or missing API key
                  code:
                    type: integer
                    example: 401
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: An unexpected error occurred while processing the request
                  code:
                    type: integer
                    example: 500

