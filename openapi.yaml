          description: Message accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Message sent successfully
                  data:
                    type: object
                    properties:
                      messaging_product:
                        type: string
                        example: whatsapp
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            input:
                              type: string
                              example: "919876543210"
                            wa_id:
                              type: string
                              example: "919876543210"
                      messages:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "wamid.HBgMOTE5ODc2NTQzMjEwFQIAERgSQ0E1MzdGQ0FFRkU4MDgzODNEAA=="
                            message_status:
                              type: string
                              example: accepted
              example:
                success: true
                message: "Message sent successfully"
                data:
                  messaging_product: "whatsapp"
                  contacts:
                    - input: "919876543210"
                      wa_id: "919876543210"
                  messages:
                    - id: "wamid.HBgMOTE5ODc2NTQzMjEwFQIAERgSQ0E1MzdGQ0FFRkU4MDgzODNEAA=="
                      message_status: "accepted"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Invalid request payload or missing required parameters
                  code:
                    type: integer
                    example: 400
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid or missing API key
                  code:
                    type: integer
                    example: 401
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: An unexpected error occurred while processing the request
