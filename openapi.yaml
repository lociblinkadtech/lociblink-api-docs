                  items:
                    type: string
                  example:
                    - "Sneha"
                    - "25"
                    - "FESTIVE25"
                buttons:
                  type: array
                  description: Dynamic call-to-action buttons
                  items:
                    type: object
                    properties:
                      type:
                        type: string
