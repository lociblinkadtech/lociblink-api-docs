  /messages/authentication:
    post:
      tags:
        - Messages
      summary: Send Authentication Message
      operationId: sendAuthenticationMessage
      description: |
        Send one-time passwords (OTP), verification codes, and security authentication using WhatsApp authentication components.

        ```bash
        curl --location 'http://localhost:8080/integrations/api/v1/whatsapp/messages' \
          --header 'X-Api-Key: YOUR_API_KEY' \
          --header 'Content-Type: application/json' \
          --header 'Accept: application/json' \
          --data '{
            "to": "919876543210",
            "templateName": "otp",
            "languageCode": "en_US",
            "components": [
              {
                "type": "body",
                "parameters": [
                  { "type": "text", "text": "481902" }
                ]
              },
              {
                "type": "button",
                "sub_type": "url",
                "index": 0,
                "parameters": [
                  { "type": "text", "text": "481902" }
                ]
              }
            ]
        }'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - templateName
                - components
              properties:
                to:
                  type: string
                  description: Recipient WhatsApp number in international format
                  example: "919876543210"
                templateName:
                  type: string
                  description: WhatsApp OTP template name
                  example: otp
                languageCode:
                  type: string
                  description: Template language code
                  example: en_US
                components:
                  type: array
                  description: Authentication components for OTP body text and copy-code button
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: body
                      sub_type:
                        type: string
                        example: url
                      index:
                        type: integer
                        example: 0
                      parameters:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              example: text
                            text:
                              type: string
                              example: "481902"
            example:
              to: "919876543210"
              templateName: "otp"
              languageCode: "en_US"
              components:
                - type: "body"
                  parameters:
                    - type: "text"
                      text: "481902"
                - type: "button"
                  sub_type: "url"
                  index: 0
                  parameters:
                    - type: "text"
                      text: "481902"
      responses:
        "200":
          description: Message accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Message sent successfully
                  data:
                    type: object
                    properties:
                      messaging_product:
                        type: string
                        example: whatsapp
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            input:
                              type: string
                              example: "919876543210"
                            wa_id:
                              type: string
                              example: "919876543210"
                      messages:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "wamid.HBgMOTE5ODc2NTQzMjEwFQIAERgSQ0E1MzdGQ0FFRkU4MDgzODNEAA=="
                            message_status:
                              type: string
                              example: accepted
              example:
                success: true
                message: "Message sent successfully"
                data:
                  messaging_product: "whatsapp"
                  contacts:
                    - input: "919876543210"
                      wa_id: "919876543210"
                  messages:
                    - id: "wamid.HBgMOTE5ODc2NTQzMjEwFQIAERgSQ0E1MzdGQ0FFRkU4MDgzODNEAA=="
                      message_status: "accepted"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Invalid request payload or missing required parameters
                  code:
                    type: integer
                    example: 400
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid or missing API key
                  code:
                    type: integer
                    example: 401
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: An unexpected error occurred while processing the request
                  code:
                    type: integer
                    example: 500

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT